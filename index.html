<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setter Theory</title>
<style>
body{font-family:sans-serif;background:#f8f0e7;padding:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:900px;margin:auto}
.card{background:#fff;border:2px solid #ff8c22;border-radius:16px;padding:16px;text-align:center}
.num{font-size:56px;color:#2563eb;font-weight:bold;margin:12px 0}
select{width:90%;padding:10px;border-radius:10px}
</style></head>
<body>
<div class="grid">
<script>
const nums=[2,7,1,3,4,5];
const opts=["レフト前衛","センター前衛","ライト前衛","レフト後衛","センター後衛","ライト後衛"];
nums.forEach((n,i)=>{
document.write(`<div class="card"><div class="num">${n}</div><select>${opts.map(o=>`<option>${o}</option>`).join("")}</select></div>`)
})
</script>
</div>
</body></html>
